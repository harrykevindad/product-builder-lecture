<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로또 5게임 추천 & Supabase 저장</title>
  <!-- Supabase CDN (버전 고정) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Pretendard', sans-serif; text-align: center; padding: 30px; background: #f5f6fa; }
    h1 { color: #2c3e50; }
    .btn { padding: 15px 30px; font-size: 18px; font-weight: bold; color: white; background: #4a90e2; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: #357abd; }
    .game-container { max-width: 600px; margin: 30px auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .game-row { display: flex; align-items: center; justify-content: space-between; margin: 15px 0; padding: 10px; border-bottom: 1px solid #eee; }
    .game-label { font-weight: bold; width: 40px; text-align: left; }
    .balls-container { display: flex; gap: 8px; }
    .ball { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 16px; animation: pop 0.3s ease-out; }
    @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
    .yellow { background: #fbc531; }
    .blue { background: #00a8ff; }
    .red { background: #e84118; }
    .gray { background: #7f8fa6; }
    .green { background: #4cd137; }
  </style>
</head>
<body>

  <h1>🎰 행운의 로또 번호 자동 생성기</h1>
  <p> VS Code와 Vite 를 이용해 성공적으로 실행했습니다. </p>
  <button class="btn" onclick="generateLotto()">로또 번호 추첨하기</button>

  <div class="game-container" id="resultArea" style="display:none;">
    <!-- 번호가 여기에 들어갑니다 -->
  </div>

  <script>
    // Supabase 연동 정보
    const SUPABASE_URL = "https://etntttfulsfbkuhklmuz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_9xgZZaDKYUFBr1lMuuLhsg_FsNo2Dot";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 공 색상 구분 함수
    function getBallColorClass(num) {
      if (num <= 10) return 'yellow';
      if (num <= 20) return 'blue';
      if (num <= 30) return 'red';
      if (num <= 40) return 'gray';
      return 'green';
    }

    // 로또 추첨 메인 함수
    async function generateLotto() {
      const labels = ['A', 'B', 'C', 'D', 'E'];
      const resultArea = document.getElementById('resultArea');
      resultArea.style.display = 'block';
      resultArea.innerHTML = '';

      const allGames = [];

      labels.forEach(label => {
        // 1~45 중 중복 없는 6개 번호 추첨 및 정렬
        const numbers = [];
        while (numbers.length < 6) {
          const rand = Math.floor(Math.random() * 45) + 1;
          if (!numbers.includes(rand)) numbers.push(rand);
        }
        numbers.sort((a, b) => a - b);
        allGames.push({ label, numbers });

        // 화면 UI 생성
        const row = document.createElement('div');
        row.className = 'game-row';
        
        const labelDiv = document.createElement('div');
        labelDiv.className = 'game-label';
        labelDiv.innerText = label;

        const ballsDiv = document.createElement('div');
        ballsDiv.className = 'balls-container';

        numbers.forEach(num => {
          const ball = document.createElement('div');
          ball.className = `ball ${getBallColorClass(num)}`;
          ball.innerText = num;
          ballsDiv.appendChild(ball);
        });

        row.appendChild(labelDiv);
        row.appendChild(ballsDiv);
        resultArea.appendChild(row);
      });

      // Supabase DB 저장
      try {
        const insertData = allGames.map(game => ({
          label: game.label,
          numbers: game.numbers
        }));

        const { data, error } = await _supabase.from('lotto_history').insert(insertData);
        if (error) console.error("Supabase 저장 실패:", error);
        else console.log("Supabase 저장 성공!", data);
      } catch (err) {
        console.error("DB 연동 에러 (화면은 정상 표시됨):", err);
      }
    }
  </script>
</body>
</html>
