      --text-secondary: #636e72;
      --accent-color: #0984e3;
      --border-color: rgba(0, 0, 0, 0.05);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      --golf-green: #27ae60;
      --prize-gold: #f1c40f;
    }
    
    [data-theme="dark"] {
      --bg-gradient: linear-gradient(135deg, #2d3436 0%, #000000 100%);
      --card-bg: rgba(45, 52, 54, 0.9);
      --text-primary: #dfe6e9;
      --text-secondary: #b2bec3;
      --accent-color: #74b9ff;
      --border-color: rgba(255, 255, 255, 0.1);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      --golf-green: #2ecc71;

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto+Sans+KR', sans-serif;
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-primary);
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 850px;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .section-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      text-align: center;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1, h2 {
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 10px;
    }

    h1 { font-size: 2.2rem; }
    h2 { font-size: 1.8rem; color: var(--golf-green); }

    .sub-text {
      font-size: 1rem;
      color: var(--text-secondary);
      margin-bottom: 30px;
    }

    /* 테마 토글 스위치 */
    .theme-switch-wrapper {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 100;
      background: var(--card-bg);
      padding: 8px 15px;
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    .theme-switch {
      display: inline-block;
      height: 24px;
      position: relative;
      width: 44px;
    }

    .theme-switch input { display: none; }

    .slider {
      background-color: #ccc;
      bottom: 0;
      cursor: pointer;
      left: 0;
      position: absolute;
      right: 0;
      top: 0;
      transition: .4s;
      border-radius: 34px;
    }

    .slider:before {
      background-color: white;
      bottom: 3px;
      content: "";
      height: 18px;
      left: 3px;
      position: absolute;
      transition: .4s;
      width: 18px;
      border-radius: 50%;
    }

    input:checked + .slider { background-color: var(--accent-color); }
    input:checked + .slider:before { transform: translateX(20px); }

    /* 골프 섹션 스타일 */
    .selector-group {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
    }

    select {
      padding: 10px 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-primary);
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      text-align: left;
    }

    @media (max-width: 768px) {
      .results-grid { grid-template-columns: 1fr; }
    }

    .league-card {
      background: rgba(0,0,0,0.03);
      padding: 24px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    [data-theme="dark"] .league-card { background: rgba(255,255,255,0.03); }

    .tournament-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent-color);
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border-color);
    }

    .league-header {
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.2rem;
      color: var(--golf-green);
    }

    .rank-item {
      display: flex;
      flex-direction: column;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
      transition: background 0.2s;
    }

    .rank-item:last-child { border-bottom: none; }

    .player-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .prize-row {
      display: flex;
      justify-content: flex-end;
      font-size: 0.85rem;
      color: var(--prize-gold);
      font-weight: 700;
    }

    .rank-num { font-weight: 700; color: var(--text-secondary); width: 25px; margin-right: 10px; }
    .player-name { flex: 1; font-weight: 700; }
    .score { font-weight: 700; color: var(--golf-green); }

    /* 로또 섹션 스타일 */
    .btn {
      padding: 16px 32px;
      font-size: 1.1rem;
      font-weight: 700;
      color: white;
      background: var(--accent-color);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(9, 132, 227, 0.3);
      width: 100%;
      max-width: 300px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(9, 132, 227, 0.4);
      filter: brightness(1.1);
    }

    .result-area {
      margin-top: 30px;
      display: none;
      animation: fadeIn 0.5s ease-out;
    }

    .game-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .game-label { font-weight: 700; color: var(--accent-color); font-size: 1.2rem; width: 30px; }
    .balls { display: flex; gap: 8px; }
    .ball {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 700; font-size: 0.9rem;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }
    @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }

    .ball.n1 { background: linear-gradient(135deg, #fbc531, #f39c12); }
    .ball.n2 { background: linear-gradient(135deg, #00a8ff, #2980b9); }
    .ball.n3 { background: linear-gradient(135deg, #e84118, #c0392b); }
    .ball.n4 { background: linear-gradient(135deg, #7f8fa6, #2f3640); }
    .ball.n5 { background: linear-gradient(135deg, #4cd137, #27ae60); }

    .form-group input, .form-group textarea {

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function getBallClass(num) {
      if (num <= 10) return 'n1';
      if (num <= 20) return 'n2';
      if (num <= 30) return 'n3';
      if (num <= 40) return 'n4';
      return 'n5';
    }

    async function generateLotto() {
      const labels = ['A', 'B', 'C', 'D', 'E'];
      const resultArea = document.getElementById('resultArea');
      resultArea.style.display = 'block';
      resultArea.innerHTML = '';
      const allGames = [];

      for (let i = 0; i < labels.length; i++) {
        const label = labels[i];
        const numbers = [];
        while (numbers.length < 6) {
          const rand = Math.floor(Math.random() * 45) + 1;
          if (!numbers.includes(rand)) numbers.push(rand);
        }
        numbers.sort((a, b) => a - b);
        allGames.push({ label, numbers });

        const row = document.createElement('div');
        row.className = 'game-row';
        row.innerHTML = `<div class="game-label">${label}</div><div class="balls"></div>`;
        const ballsDiv = row.querySelector('.balls');
        numbers.forEach((num, idx) => {
          const ball = document.createElement('div');
          ball.className = `ball ${getBallClass(num)}`;
          ball.innerText = num;
          ball.style.animationDelay = `${(i * 0.1) + (idx * 0.05)}s`;
          ballsDiv.appendChild(ball);
        });
        resultArea.appendChild(row);
      }

      try {
        await _supabase.from('lotto_history').insert(allGames.map(g => ({ label: g.label, numbers: g.numbers })));
      } catch (err) { console.error(err); }
    }

    // Form logic
    const form = document.getElementById("contact-form");
    const status = document.getElementById("form-status");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.innerText = "전송 중...";
      try {
        const response = await fetch(form.action, {
          method: 'POST', body: new FormData(form), headers: { 'Accept': 'application/json' }
        });
        if (response.ok) {
          status.innerText = "🚀 문의가 전송되었습니다!";
          status.className = "success";
          form.reset();
        } else { throw new Error(); }
      } catch {
        status.innerText = "전송 오류가 발생했습니다.";
        status.className = "error";
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "문의 보내기";
        status.style.display = "block";
      }
    });
  </script>
