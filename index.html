<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프리미엄 로또 번호 생성기</title>
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      --card-bg: rgba(255, 255, 255, 0.9);
      --text-primary: #2d3436;
      --text-secondary: #636e72;
      --accent-color: #0984e3;
      --border-color: rgba(0, 0, 0, 0.05);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }
    
    [data-theme="dark"] {
      --bg-gradient: linear-gradient(135deg, #2d3436 0%, #000000 100%);
      --card-bg: rgba(45, 52, 54, 0.9);
      --text-primary: #dfe6e9;
      --text-secondary: #b2bec3;
      --accent-color: #74b9ff;
      --border-color: rgba(255, 255, 255, 0.1);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto+Sans+KR', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-gradient);
      color: var(--text-primary);
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    p {
      font-size: 1rem;
      color: var(--text-secondary);
      margin-bottom: 30px;
    }

    /* 테마 토글 스위치 */
    .theme-switch-wrapper {
      position: absolute;
      top: 30px;
      right: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-switch {
      display: inline-block;
      height: 28px;
      position: relative;
      width: 50px;
    }

    .theme-switch input { display: none; }

    .slider {
      background-color: #ccc;
      bottom: 0;
      cursor: pointer;
      left: 0;
      position: absolute;
      right: 0;
      top: 0;
      transition: .4s;
      border-radius: 34px;
    }

    .slider:before {
      background-color: white;
      bottom: 4px;
      content: "";
      height: 20px;
      left: 4px;
      position: absolute;
      transition: .4s;
      width: 20px;
      border-radius: 50%;
    }

    input:checked + .slider { background-color: var(--accent-color); }
    input:checked + .slider:before { transform: translateX(22px); }

    .btn {
      padding: 16px 32px;
      font-size: 1.1rem;
      font-weight: 700;
      color: white;
      background: var(--accent-color);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(9, 132, 227, 0.3);
      width: 100%;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(9, 132, 227, 0.4);
      filter: brightness(1.1);
    }

    .btn:active { transform: translateY(0); }

    .result-area {
      margin-top: 30px;
      display: none;
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .game-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .game-row:last-child { border-bottom: none; }

    .game-label {
      font-weight: 700;
      color: var(--accent-color);
      font-size: 1.2rem;
      width: 30px;
    }

    .balls { display: flex; gap: 8px; }

    .ball {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 0.9rem;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }

    @keyframes pop {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }

    .ball.n1 { background: linear-gradient(135deg, #fbc531, #f39c12); } /* 1-10 */
    .ball.n2 { background: linear-gradient(135deg, #00a8ff, #2980b9); } /* 11-20 */
    .ball.n3 { background: linear-gradient(135deg, #e84118, #c0392b); } /* 21-30 */
    .ball.n4 { background: linear-gradient(135deg, #7f8fa6, #2f3640); } /* 31-40 */
    .ball.n5 { background: linear-gradient(135deg, #4cd137, #27ae60); } /* 41-45 */

    /* 제휴 문의 폼 스타일 */
    .contact-section {
      margin-top: 50px;
      padding-top: 30px;
      border-top: 1px solid var(--border-color);
      text-align: left;
    }

    .contact-section h2 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      text-align: center;
      color: var(--text-primary);
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 5px;
      color: var(--text-secondary);
      font-weight: 700;
    }

    .form-group input, 
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.95rem;
      transition: border-color 0.3s;
    }

    .form-group input:focus, 
    .form-group textarea:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, filter 0.2s;
    }

    .submit-btn:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .submit-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    #form-status {
      margin-top: 15px;
      font-size: 0.9rem;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      display: none;
    }

    #form-status.success {
      display: block;
      background: rgba(76, 209, 55, 0.1);
      color: #27ae60;
      border: 1px solid rgba(76, 209, 55, 0.3);
    }

    #form-status.error {
      display: block;
      background: rgba(232, 65, 24, 0.1);
      color: #c0392b;
      border: 1px solid rgba(232, 65, 24, 0.3);
    }

    /* Disqus 섹션 스타일 */
    .comments-section {
      margin-top: 50px;
      padding-top: 30px;
      border-top: 1px solid var(--border-color);
      text-align: left;
    }

    footer {
      margin-top: 30px;
      font-size: 0.8rem;
      color: var(--text-secondary);
      opacity: 0.7;
    }
  </style>
  <script>
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</head>
<body>

  <div class="theme-switch-wrapper">
    <span id="theme-text">🌙 Dark Mode</span>
    <label class="theme-switch" for="checkbox">
      <input type="checkbox" id="checkbox" onchange="toggleTheme()" />
      <div class="slider"></div>
    </label>
  </div>

  <div class="container">
    <h1>🎰 Fortune Lotto</h1>
    <p>오늘의 행운을 점쳐보세요.</p>
    <button class="btn" onclick="generateLotto()">행운의 번호 뽑기</button>

    <div class="result-area" id="resultArea">
      <!-- Games will be injected here -->
    </div>

    <div class="contact-section">
      <h2>🤝 제휴 문의</h2>
      <form id="contact-form" action="https://formspree.io/f/myegzbyg" method="POST">
        <div class="form-group">
          <label>이메일 주소</label>
          <input type="email" name="email" placeholder="example@email.com" required>
        </div>
        <div class="form-group">
          <label>문의 내용</label>
          <textarea name="message" rows="4" placeholder="제휴 관련 문의 내용을 입력해주세요." required></textarea>
        </div>
        <button type="submit" id="submit-btn" class="submit-btn">문의 보내기</button>
        <div id="form-status"></div>
      </form>
    </div>

    <!-- Disqus 댓글 섹션 -->
    <div class="comments-section">
      <div id="disqus_thread"></div>
      <script>
          /**
          *  RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS.
          *  LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables    */
          /*
          var disqus_config = function () {
          this.page.url = PAGE_URL;  // Replace PAGE_URL with your page's canonical URL variable
          this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable
          };
          */
          (function() { // DON'T EDIT BELOW THIS LINE
          var d = document, s = d.createElement('script');
          s.src = 'https://product-builder-bmk4gojg4r.disqus.com/embed.js';
          s.setAttribute('data-timestamp', +new Date());
          (d.head || d.body).appendChild(s);
          })();
      </script>
      <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
    </div>

    <footer>
      Powered by Supabase & Gemini CLI
    </footer>
  </div>

  <script>
    // Initialize theme UI
    const currentTheme = localStorage.getItem('theme') || 'light';
    const checkbox = document.querySelector('#checkbox');
    const themeText = document.querySelector('#theme-text');
    
    if (currentTheme === 'dark') {
      checkbox.checked = true;
      themeText.innerText = '☀️ Light Mode';
    }

    function toggleTheme() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const newTheme = isDark ? 'light' : 'dark';
      
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      
      checkbox.checked = (newTheme === 'dark');
      themeText.innerText = newTheme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
    }

    // Form Submission Handling
    const form = document.getElementById("contact-form");
    const status = document.getElementById("form-status");
    const submitBtn = document.getElementById("submit-btn");

    async function handleSubmit(event) {
      event.preventDefault();
      status.style.display = "none";
      status.className = "";
      submitBtn.disabled = true;
      submitBtn.innerText = "보내는 중...";

      const data = new FormData(event.target);
      
      try {
        const response = await fetch(event.target.action, {
          method: form.method,
          body: data,
          headers: {
            'Accept': 'application/json'
          }
        });

        if (response.ok) {
          status.innerText = "🚀 문의가 성공적으로 전송되었습니다!";
          status.className = "success";
          form.reset();
        } else {
          const result = await response.json();
          if (Object.hasOwn(result, 'errors')) {
            status.innerText = result.errors.map(error => error.message).join(", ");
          } else {
            status.innerText = "Oops! 전송 중 오류가 발생했습니다.";
          }
          status.className = "error";
        }
      } catch (error) {
        status.innerText = "Oops! 전송 중 네트워크 오류가 발생했습니다.";
        status.className = "error";
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "문의 보내기";
        status.style.display = "block";
      }
    }
    form.addEventListener("submit", handleSubmit);

    // Supabase Config
    const SUPABASE_URL = "https://etntttfulsfbkuhklmuz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_9xgZZaDKYUFBr1lMuuLhsg_FsNo2Dot";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function getBallClass(num) {
      if (num <= 10) return 'n1';
      if (num <= 20) return 'n2';
      if (num <= 30) return 'n3';
      if (num <= 40) return 'n4';
      return 'n5';
    }

    async function generateLotto() {
      const labels = ['A', 'B', 'C', 'D', 'E'];
      const resultArea = document.getElementById('resultArea');
      resultArea.style.display = 'block';
      resultArea.innerHTML = '';

      const allGames = [];

      for (let i = 0; i < labels.length; i++) {
        const label = labels[i];
        const numbers = [];
        while (numbers.length < 6) {
          const rand = Math.floor(Math.random() * 45) + 1;
          if (!numbers.includes(rand)) numbers.push(rand);
        }
        numbers.sort((a, b) => a - b);
        allGames.push({ label, numbers });

        const row = document.createElement('div');
        row.className = 'game-row';
        row.style.animationDelay = `${i * 0.1}s`;

        const labelDiv = document.createElement('div');
        labelDiv.className = 'game-label';
        labelDiv.innerText = label;

        const ballsDiv = document.createElement('div');
        ballsDiv.className = 'balls';

        numbers.forEach((num, index) => {
          const ball = document.createElement('div');
          ball.className = `ball ${getBallClass(num)}`;
          ball.innerText = num;
          ball.style.animationDelay = `${(i * 0.1) + (index * 0.05)}s`;
          ballsDiv.appendChild(ball);
        });

        row.appendChild(labelDiv);
        row.appendChild(ballsDiv);
        resultArea.appendChild(row);
      }

      // Save to Supabase
      try {
        const insertData = allGames.map(game => ({
          label: game.label,
          numbers: game.numbers
        }));
        await _supabase.from('lotto_history').insert(insertData);
      } catch (err) {
        console.error("Supabase Error:", err);
      }
    }
  </script>
</body>
</html>
